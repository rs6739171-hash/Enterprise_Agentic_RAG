name: Verify deployment
on:
  push:
    branches: [codex/deployment-readiness-20260916]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime and test dependencies
        run: python -m pip install -r "Interprise Grade Rag/requirements-runtime.txt" httpx pandas pydantic pyyaml
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run regression and integration tests without API calls
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q "Interprise Grade Rag"
